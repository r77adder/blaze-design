# Netlify build config for the prototype playground.
#
# Deploys the Vite app at `src/playground/` as a static site so designers/PMs
# can share prototype URLs (e.g. `…netlify.app/h2/organic-social`) without
# running anything locally. Each PR gets its own preview deploy automatically.
#
# IMPORTANT: This deploys the playground only — the publishable lib output
# (`lib/` + `module/`) is NOT shipped to Netlify. That's handled separately
# via `pnpm publish:tag` and consumed via git tag.

[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build:playground"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — client-side router handles routes like `/h2/organic-social`,
# `/modal-showcase`, etc. Without this, hitting those URLs directly would 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
