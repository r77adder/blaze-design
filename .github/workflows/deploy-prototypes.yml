name: Deploy prototypes

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  pull-requests: write   # for posting preview URL comment

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Determine target path and base
        id: target
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            PR_NUMBER='${{ github.event.pull_request.number }}'
            echo "base=/prototypes/pr/${PR_NUMBER}/" >> "$GITHUB_OUTPUT"
            echo "primary_path=pr/${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "secondary_path=" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/prototypes/" >> "$GITHUB_OUTPUT"
            echo "primary_path=main/latest" >> "$GITHUB_OUTPUT"
            echo "secondary_path=main/${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build playground
        env:
          VITE_BASE_PATH: ${{ steps.target.outputs.base }}
        run: pnpm build:playground

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        run: |
          gcloud storage rsync -r --delete-unmatched-destination-objects \
            dist/ gs://${{ secrets.GCP_PROTOTYPE_BUCKET }}/${{ steps.target.outputs.primary_path }}/

      - name: Archive main build by SHA
        if: steps.target.outputs.is_pr == 'false'
        run: |
          gcloud storage cp -r dist/* \
            gs://${{ secrets.GCP_PROTOTYPE_BUCKET }}/${{ steps.target.outputs.secondary_path }}/

      - name: Comment preview URL on PR
        if: steps.target.outputs.is_pr == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: prototype-preview
          message: |
            ## Prototype preview ready

            **URL:** https://qa.blaze.ai/prototypes/pr/${{ steps.target.outputs.pr_number }}/

            Requires `@blaze.ai` Google sign-in (IAP). Updated automatically on every push.
