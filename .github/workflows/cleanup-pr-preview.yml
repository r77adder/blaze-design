name: Cleanup PR prototype preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete PR preview directory
        run: |
          gcloud storage rm -r \
            gs://${{ secrets.GCP_PROTOTYPE_BUCKET }}/pr/${{ github.event.pull_request.number }}/ \
            2>&1 | tee /tmp/rm.log
          # Tolerate already-missing (PR closed twice, lifecycle already swept, etc.)
          if grep -q 'NotFound\|does not exist' /tmp/rm.log; then
            echo "Already gone — nothing to clean up."
          fi
        continue-on-error: true
