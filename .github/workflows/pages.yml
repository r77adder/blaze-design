name: Deploy to GitHub Pages

# Builds the prototype playground and publishes it to GitHub Pages.
# Live at: https://r77adder.github.io/blaze-design/
# No external infra — replaces the old GCP/qa.blaze.ai deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: pnpm install --frozen-lockfile

      - name: Build playground
        env:
          VITE_BASE_PATH: /blaze-design/
        run: pnpm build:playground

      - name: SPA deep-link fallback
        # GitHub Pages serves 404.html for unknown paths; making it a copy of
        # index.html lets client-side routes like /blaze-design/dfy-client load.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
